<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        html{
            margin: 0;
            padding: 0;
        }
        body{
            background-color:antiquewhite;
            text-align: center;
        }
        main{
            width: 960px;
            height: 1000px;
            margin: 0 auto;
            background-color:chocolate;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        header{
            width: 960px;
            height: 80px;
            background-color: rgb(190, 223, 153);
        }
        nav{
            width: 960px;
            height: 80px;
            background-color: rgb(190, 223, 153);
        }
        section{
            width: 960px;
            height: 600px;
            display: flex;
            flex-direction: row;
            column-gap: 10px;
        }
        #left{
            flex-grow: 1;
            background-color: #999;
        }
        #right{
            flex-grow: 2;
            background-color: #777;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        aside,article{
            background-color: #CCC;
            flex-grow: 1;
        }
        footer{
            width: 960px;
            height: 80px;
            background-color: rgb(190, 223, 153);
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h2>Header</h2>
        </header>
        <nav>
            <h2>Navbar</h2>
        </nav>
        <section>
            <div id="left">
            </div>
            <div id="right">
                <article>
                    <h2>Article</h2>
                </article>
                <aside>
                    <h2>Aside</h2>
                </aside>
            </div>
        </section>
        <footer>
            <h2>Footer</h2>
        </footer>
    </main>
</body>
</html>
