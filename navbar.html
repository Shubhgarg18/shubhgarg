<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        *,html{
            margin: 0;
            height: 0;
        }
        body{
            background-color:antiquewhite;
        }
        nav ul{
            list-style-type: none;
            display: flex;
            justify-content: center;
            margin-top: 10px;
            background-color: #CCC;
        }
        nav ul li{
            margin-right: 20px;
        }
        nav ul li a{
            text-decoration: none;
            color: black;
            padding: 5px 6px;
            font-weight: bold;
        }
        ul li a:hover{
            color: blue;
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li id="apply-now"><a href="">Apply Now</a></li>
            <li><a href="#">Home</a></li>
            <li><a href="list.html" target="_blank">About</a></li>
            <li><a href="homework.html" target="_blank">Services</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="#">Blog</a></li>
            <li><a href="#">FAQ</a></li>
        </ul>
    </nav>
</body>
</html>
